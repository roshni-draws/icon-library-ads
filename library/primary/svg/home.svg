<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-home" role="img" aria-label="Home">
<style>
.antz-p-home-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-home-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-home-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-home-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-home-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-home-light{0%{opacity:1}4%{opacity:1}11%{opacity:0}20%{opacity:0}25%{opacity:1}28%{opacity:0.35}33%{opacity:1}100%{opacity:1}}
.antz-p-home-light{animation:antz-p-home-light 4050ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-home-smoke1{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}34%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}39%{transform:translate(0.45px,-1.05px) rotate(0deg) scale(1);opacity:1}48%{transform:translate(1.2px,-2.8px) rotate(0deg) scale(1);opacity:1}54%{transform:translate(1.5px,-3.5px) rotate(0deg) scale(1);opacity:0}55%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-home-smoke1{transform-box:view-box;transform-origin:31.75px 7.5px;animation:antz-p-home-smoke1 4050ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-home-smoke2{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}42%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}47%{transform:translate(0.9px,-0.75px) rotate(0deg) scale(1);opacity:1}56%{transform:translate(2.4px,-2px) rotate(0deg) scale(1);opacity:1}62%{transform:translate(3px,-2.5px) rotate(0deg) scale(1);opacity:0}63%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-home-smoke2{transform-box:view-box;transform-origin:33px 7px;animation:antz-p-home-smoke2 4050ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-home *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-home-f-tile" fill="#36BC69"/>
  <rect x="29.5" y="10.5" width="4.5" height="8" rx="1.2" class="antz-p-home-f-ink" fill="#00451F"/>
  <path d="M24 10.5L12 22.5V34.5A3 3 0 0 0 15 37.5H33A3 3 0 0 0 36 34.5V22.5Z" class="antz-p-home-f-fill antz-p-home-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-home-light">
    <path d="M20.5 36.5V28.75A3.5 3.5 0 0 1 27.5 28.75V36.5Z" class="antz-p-home-f-accent" fill="#005226"/>
  </g>
  <path d="M19.75 37.5V28.75A4.25 4.25 0 0 1 28.25 28.75V37.5" class="antz-p-home-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-home-smoke1" opacity="0">
    <circle cx="31.75" cy="7.5" r="1.8" class="antz-p-home-f-ink" fill="#00451F"/>
  </g>
  <g class="antz-p-home-smoke2" opacity="0">
    <circle cx="33" cy="7" r="1.5" class="antz-p-home-f-ink" fill="#00451F"/>
  </g>
</svg>
