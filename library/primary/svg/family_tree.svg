<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-family_tree" role="img" aria-label="Family tree">
<style>
.antz-p-family_tree-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-family_tree-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-family_tree-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-family_tree-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-family_tree-descent{0%{opacity:1}4%{opacity:1}10%{opacity:0}11%{opacity:0}18%{opacity:1}32%{opacity:1}100%{opacity:1}}
.antz-p-family_tree-descent{animation:antz-p-family_tree-descent 3100ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-family_tree-descent-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}10%{stroke-dasharray:1 2;stroke-dashoffset:0}11%{stroke-dasharray:0 2;stroke-dashoffset:0}18%{stroke-dasharray:0.05 2;stroke-dashoffset:0}32%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-family_tree-descent-trim{animation:antz-p-family_tree-descent-trim 3100ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-family_tree-sire{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}14%{transform:translate(2.5px,0px) rotate(0deg) scale(1);}26%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-family_tree-sire{transform-box:view-box;transform-origin:13.5px 15.5px;animation:antz-p-family_tree-sire 3100ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-family_tree-dam{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}14%{transform:translate(-2.5px,0px) rotate(0deg) scale(1);}26%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-family_tree-dam{transform-box:view-box;transform-origin:34.5px 15.5px;animation:antz-p-family_tree-dam 3100ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-family_tree-offspring{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}10%{transform:translate(0px,0px) rotate(0deg) scale(0.9);opacity:0}30%{transform:translate(0px,0px) rotate(0deg) scale(0.9);opacity:0}42%{transform:translate(0px,0px) rotate(0deg) scale(1.1);opacity:1}52%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-family_tree-offspring{transform-box:view-box;transform-origin:24px 38px;animation:antz-p-family_tree-offspring 3100ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-family_tree *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-family_tree-f-tile" fill="#36BC69"/>
  <path d="M19 15.5H29" class="antz-p-family_tree-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-family_tree-descent">
    <path d="M24 15.5V27" class="antz-p-family_tree-s-ink antz-p-family_tree-descent-trim" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/>
  </g>
  <g class="antz-p-family_tree-sire">
    <rect x="8" y="10" width="11" height="11" rx="2.5" class="antz-p-family_tree-f-fill antz-p-family_tree-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-family_tree-dam">
    <circle cx="34.5" cy="15.5" r="6" class="antz-p-family_tree-f-fill antz-p-family_tree-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-family_tree-offspring">
    <circle cx="24" cy="32.5" r="6" class="antz-p-family_tree-f-fill antz-p-family_tree-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="32.5" r="2.5" class="antz-p-family_tree-f-accent" fill="#005226"/>
  </g>
</svg>
