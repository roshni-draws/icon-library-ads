    <path d="M29.1 8.7C31.917 8.7 34.2 10.983 34.2 13.8C34.2 16.617 31.917 18.9 29.1 18.9C26.283 18.9 24 16.617 24 13.8C24 10.983 26.283 8.7 29.1 8.7Z" class="antz-p-staff-f-fill antz-p-staff-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
