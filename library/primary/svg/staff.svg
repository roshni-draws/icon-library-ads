  <g class="antz-p-staff-badge">
    <path d="M16.5 32H19.5C20.19 32 20.75 32.56 20.75 33.25V35C20.75 35.69 20.19 36.25 19.5 36.25H16.5C15.81 36.25 15.25 35.69 15.25 35V33.25C15.25 32.56 15.81 32 16.5 32Z" class="antz-p-staff-f-accent" fill="#005226"/>
  </g>
</svg>
