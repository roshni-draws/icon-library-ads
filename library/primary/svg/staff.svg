<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-staff" role="img" aria-label="Staff">
<style>
.antz-p-staff-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-staff-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-staff-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-staff-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-staff-colleague{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}14%{transform:translate(0px,3.5px) rotate(0deg) scale(1);opacity:0}20%{transform:translate(0px,3.5px) rotate(0deg) scale(1);opacity:0}30%{transform:translate(0px,-1.5px) rotate(0deg) scale(1);opacity:1}38%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-staff-colleague{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-staff-colleague 4150ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-staff-badge{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}36%{transform:translate(0px,0px) rotate(0deg) scale(1);}42%{transform:translate(0px,0px) rotate(0deg) scale(1.1);}48%{transform:translate(0px,0px) rotate(0deg) scale(0.96);}54%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-staff-badge{transform-box:view-box;transform-origin:18px 34.125px;animation:antz-p-staff-badge 4150ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-staff *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-staff-f-tile" fill="#36BC69"/>
