<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-lab" role="img" aria-label="Lab">
<style>
.antz-p-lab-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-lab-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-lab-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-lab-s-fill{stroke:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-lab-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-lab-liquid{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}14%{transform:translate(-2px,-3.4px) rotate(-12deg) scale(1);}25%{transform:translate(2.2px,-2.4px) rotate(10deg) scale(1);}35%{transform:translate(-1.5px,-0.8px) rotate(-6deg) scale(1);}44%{transform:translate(0.8px,0px) rotate(3deg) scale(1);}52%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-lab-liquid{transform-box:view-box;transform-origin:24px 31px;animation:antz-p-lab-liquid 3800ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-lab-bubble1{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}12%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}17%{transform:translate(0.24px,-2px) rotate(0deg) scale(1);opacity:1}29%{transform:translate(0.84px,-6px) rotate(0deg) scale(1);opacity:1}36%{transform:translate(1.2px,-7.5px) rotate(0deg) scale(1);opacity:0}37%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-lab-bubble1{transform-box:view-box;transform-origin:21.5px 31.5px;animation:antz-p-lab-bubble1 3800ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-lab-bubble2{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}20%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}25%{transform:translate(0px,-2px) rotate(0deg) scale(1);opacity:1}37%{transform:translate(0px,-6px) rotate(0deg) scale(1);opacity:1}44%{transform:translate(0px,-7.5px) rotate(0deg) scale(1);opacity:0}45%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-lab-bubble2{transform-box:view-box;transform-origin:24.5px 32.5px;animation:antz-p-lab-bubble2 3800ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-lab-bubble3{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}28%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}33%{transform:translate(-0.24px,-2px) rotate(0deg) scale(1);opacity:1}45%{transform:translate(-0.84px,-6px) rotate(0deg) scale(1);opacity:1}52%{transform:translate(-1.2px,-7.5px) rotate(0deg) scale(1);opacity:0}53%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-lab-bubble3{transform-box:view-box;transform-origin:27px 31.5px;animation:antz-p-lab-bubble3 3800ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-lab *{animation:none!important}}
</style>
<defs><clipPath id="antz-p-lab-liquid-clip"><path d="M21 10.5V19.5L13.5 34.5A3 3 0 0 0 16.5 37.5H31.5A3 3 0 0 0 34.5 34.5L27 19.5V10.5Z"/></clipPath></defs>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-lab-f-tile" fill="#36BC69"/>
  <path d="M21 10.5V19.5L13.5 34.5A3 3 0 0 0 16.5 37.5H31.5A3 3 0 0 0 34.5 34.5L27 19.5V10.5Z" class="antz-p-lab-f-fill" fill="#CCE5FF"/>
  <g clip-path="url(#antz-p-lab-liquid-clip)"><g class="antz-p-lab-liquid">
    <path d="M2 30Q7 27.6 12 30T22 30T32 30T42 30T52 30V46H2Z" class="antz-p-lab-f-accent" fill="#005226"/>
  </g></g>
  <path d="M19.2 32.6L17.9 35.2" class="antz-p-lab-s-fill" fill="none" stroke="#CCE5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-lab-bubble1" opacity="0">
    <circle cx="21.5" cy="31.5" r="2.3" class="antz-p-lab-f-fill antz-p-lab-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-lab-bubble2" opacity="0">
    <circle cx="24.5" cy="32.5" r="2.3" class="antz-p-lab-f-fill antz-p-lab-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-lab-bubble3" opacity="0">
    <circle cx="27" cy="31.5" r="2.3" class="antz-p-lab-f-fill antz-p-lab-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M21 10.5V19.5L13.5 34.5A3 3 0 0 0 16.5 37.5H31.5A3 3 0 0 0 34.5 34.5L27 19.5V10.5" class="antz-p-lab-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 10.5H30" class="antz-p-lab-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
