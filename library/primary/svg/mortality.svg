<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-mortality" role="img" aria-label="Mortality">
<style>
.antz-p-mortality-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-mortality-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-mortality-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-mortality-s-accent{stroke:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-mortality-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
.antz-p-mortality-s-shade{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-mortality-fallingLeaf{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}6%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}16%{transform:translate(-1.2px,1.6px) rotate(-10deg) scale(1);opacity:1}32%{transform:translate(1px,4px) rotate(10deg) scale(1);opacity:1}48%{transform:translate(-0.8px,6.2px) rotate(-8deg) scale(1);opacity:1}64%{transform:translate(0.8px,7.8px) rotate(4deg) scale(1);opacity:0}65%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-mortality-fallingLeaf{transform-box:view-box;transform-origin:37.5px 11px;animation:antz-p-mortality-fallingLeaf 3500ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-mortality *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-mortality-f-tile" fill="#36BC69"/>
  <path d="M9 22.5A12 12 0 0 1 33 22.5V27A3 3 0 0 1 30 30V34.5A3 3 0 0 1 27 37.5H15A3 3 0 0 1 12 34.5V30A3 3 0 0 1 9 27Z" class="antz-p-mortality-f-fill antz-p-mortality-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28.4 13.6C30 15.5 31 18 31 20.5V27" class="antz-p-mortality-s-shade" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/>
  <circle cx="16.5" cy="24" r="2.6" class="antz-p-mortality-f-ink" fill="#00451F"/>
  <circle cx="25.5" cy="24" r="2.6" class="antz-p-mortality-f-ink" fill="#00451F"/>
  <path d="M21 31.5V37.5" class="antz-p-mortality-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-mortality-fallingLeaf" opacity="0">
    <path d="M32.304 14Q34.5 5.804 42.696 8 40.5 16.196 32.304 14Z" class="antz-p-mortality-f-fill antz-p-mortality-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35.075 12.4L39.925 9.6" class="antz-p-mortality-s-accent" fill="none" stroke="#005226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
