<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-requests" role="img" aria-label="Requests">
<style>
.antz-p-requests-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-requests-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-requests-s-accent{stroke:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-requests-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
.antz-p-requests-s-shade{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-requests-check{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}10%{transform:translate(0px,0px) rotate(0deg) scale(0.9);opacity:0}36%{transform:translate(0px,0px) rotate(0deg) scale(0.9);opacity:0}42%{transform:translate(0px,0px) rotate(0deg) scale(1.1);opacity:1}50%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-requests-check{transform-box:view-box;transform-origin:24px 35px;animation:antz-p-requests-check 3700ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-requests-stamp{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}8%{transform:translate(0px,0px) rotate(0deg) scale(1);}20%{transform:translate(0px,-3px) rotate(0deg) scale(1);}30%{transform:translate(0px,4px) rotate(0deg) scale(1);}34%{transform:translate(0px,4px) rotate(0deg) scale(1.04);}44%{transform:translate(0px,-1px) rotate(0deg) scale(1);}52%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-requests-stamp{transform-box:view-box;transform-origin:24px 23px;animation:antz-p-requests-stamp 3700ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-requests *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-requests-f-tile" fill="#36BC69"/>
  <rect x="9" y="28.5" width="30" height="13" rx="3" class="antz-p-requests-f-fill antz-p-requests-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-requests-check">
    <path d="M18 35.2L21.8 38.2L30 31.8" class="antz-p-requests-s-accent" fill="none" stroke="#005226" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-requests-stamp">
    <path d="M21 17.5V10.5A3 3 0 0 1 27 10.5V17.5Z" class="antz-p-requests-f-fill antz-p-requests-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="13.5" y="17.5" width="21" height="6" rx="2.5" class="antz-p-requests-f-fill antz-p-requests-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 21.5H32" class="antz-p-requests-s-shade" fill="none" stroke="#00451F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/>
  </g>
</svg>
