<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-transfers" role="img" aria-label="Transfers">
<style>
.antz-p-transfers-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-transfers-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-transfers-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-transfers-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-transfers-s-fill{stroke:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-transfers-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-transfers-speed{0%{opacity:0}20%{opacity:0}23%{opacity:1}36%{opacity:1}44%{opacity:1}54%{opacity:0}56%{opacity:0}100%{opacity:0}}
.antz-p-transfers-speed{animation:antz-p-transfers-speed 3650ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-transfers-speed-trim{0%{stroke-dasharray:0 2;stroke-dashoffset:0}20%{stroke-dasharray:0 2;stroke-dashoffset:0}23%{stroke-dasharray:0.2 2;stroke-dashoffset:0}36%{stroke-dasharray:1 2;stroke-dashoffset:0}44%{stroke-dasharray:1 2;stroke-dashoffset:0}54%{stroke-dasharray:1 2;stroke-dashoffset:0}56%{stroke-dasharray:0 2;stroke-dashoffset:0}100%{stroke-dasharray:0 2;stroke-dashoffset:0}}
.antz-p-transfers-speed-trim{animation:antz-p-transfers-speed-trim 3650ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-transfers-truck{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}16%{transform:translate(-4px,0px) rotate(0deg) scale(1);}36%{transform:translate(1px,0px) rotate(0deg) scale(1);}42%{transform:translate(1px,0px) rotate(2.5deg) scale(1);}50%{transform:translate(0px,0px) rotate(-0.8deg) scale(1);}58%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-transfers-truck{transform-box:view-box;transform-origin:36.5px 37.5px;animation:antz-p-transfers-truck 3650ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-transfers-hubPlus{0%{opacity:1}4%{opacity:1}10%{opacity:0}16%{opacity:1}22%{opacity:0}28%{opacity:1}34%{opacity:0}40%{opacity:1}100%{opacity:1}}
.antz-p-transfers-hubPlus{animation:antz-p-transfers-hubPlus 3650ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-transfers-hubX{0%{opacity:0}4%{opacity:0}10%{opacity:1}16%{opacity:0}22%{opacity:1}28%{opacity:0}34%{opacity:1}40%{opacity:0}100%{opacity:0}}
.antz-p-transfers-hubX{animation:antz-p-transfers-hubX 3650ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-transfers *{animation:none!important}}
</style>
