<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-transfers" role="img" aria-label="Transfers">
<style>
.antz-p-transfers-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-transfers-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-transfers-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-transfers-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-transfers-arrow{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}8%{transform:translate(0px,0px) rotate(0deg) scale(1);}22%{transform:translate(2.5px,0px) rotate(0deg) scale(1);}32%{transform:translate(-1px,0px) rotate(0deg) scale(1);}42%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-transfers-arrow{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-transfers-arrow 3650ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-transfers-crate{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}6%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}12%{transform:translate(-1px,-1.5px) rotate(-3deg) scale(1);opacity:1}24%{transform:translate(3.8px,-1px) rotate(3deg) scale(1);opacity:0}28%{transform:translate(-3.8px,-1px) rotate(0deg) scale(1);opacity:0}42%{transform:translate(0.5px,-0.5px) rotate(0deg) scale(1);opacity:1}50%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-transfers-crate{transform-box:view-box;transform-origin:24px 30px;animation:antz-p-transfers-crate 3650ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-transfers *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-transfers-f-tile" fill="#36BC69"/>
  <g class="antz-p-transfers-arrow">
    <path d="M11.5 37.5H35.5M31.5 33.5L35.5 37.5L31.5 41.5" class="antz-p-transfers-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-transfers-crate">
    <rect x="14" y="12" width="20" height="17" rx="3" class="antz-p-transfers-f-fill antz-p-transfers-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 18H34" class="antz-p-transfers-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="19.5" y="21.5" width="9" height="4.5" rx="1.5" class="antz-p-transfers-f-accent" fill="#005226"/>
  </g>
</svg>
