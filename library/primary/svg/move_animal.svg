@keyframes antz-p-move_animal-pin{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}44%{transform:translate(0px,0px) rotate(0deg) scale(1);}50%{transform:translate(0px,0px) rotate(0deg) scale(1.1);}58%{transform:translate(0px,0px) rotate(0deg) scale(0.97);}64%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-move_animal-pin{transform-box:view-box;transform-origin:36px 23.5px;animation:antz-p-move_animal-pin 3300ms cubic-bezier(.45,0,.55,1) infinite}
