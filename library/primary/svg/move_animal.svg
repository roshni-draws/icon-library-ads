.antz-p-move_animal-s-accent{stroke:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-move_animal-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-move_animal-route{0%{opacity:1}4%{opacity:1}12%{opacity:0}14%{opacity:0}18%{opacity:1}46%{opacity:1}100%{opacity:1}}
.antz-p-move_animal-route{animation:antz-p-move_animal-route 3300ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-move_animal-route-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}12%{stroke-dasharray:1 2;stroke-dashoffset:0}14%{stroke-dasharray:0.04 2;stroke-dashoffset:0}18%{stroke-dasharray:0.04 2;stroke-dashoffset:0}46%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
