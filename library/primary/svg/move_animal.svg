.antz-p-move_animal-truck{transform-box:view-box;transform-origin:20.55px 40.5px;animation:antz-p-move_animal-truck 3300ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-move_animal *{animation:none!important}}
