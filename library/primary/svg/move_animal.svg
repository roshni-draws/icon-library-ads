.antz-p-move_animal-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-move_animal-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-move_animal-f-shade{fill:var(--antz-on-primary-container,#00451F)}
