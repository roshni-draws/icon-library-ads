<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-move_animal" role="img" aria-label="Move animal">
<style>
.antz-p-move_animal-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-move_animal-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-move_animal-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-move_animal-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-move_animal-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-move_animal-paw{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}12%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}18%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}32%{transform:translate(0.8px,0px) rotate(0deg) scale(1);opacity:1}40%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-move_animal-paw{transform-box:view-box;transform-origin:30.5px 23.5px;animation:antz-p-move_animal-paw 3300ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-move_animal-arrow{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}6%{transform:translate(0px,0px) rotate(0deg) scale(1);}16%{transform:translate(-3px,0px) rotate(0deg) scale(1);}28%{transform:translate(3px,0px) rotate(0deg) scale(1);}38%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-move_animal-arrow{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-move_animal-arrow 3300ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-move_animal *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-move_animal-f-tile" fill="#36BC69"/>
  <path d="M22 10.5H37A3 3 0 0 1 40 13.5V34.5A3 3 0 0 1 37 37.5H22Z" class="antz-p-move_animal-f-fill" fill="#CCE5FF"/>
  <rect x="25.5" y="31" width="11" height="3.5" rx="1.75" class="antz-p-move_animal-f-accent" fill="#005226"/>
  <g class="antz-p-move_animal-paw">
    <path d="M32.15 23.5C32.15 21.85 29.95 20.2 28.85 20.2A1.65 1.65 0 0 0 27.2 21.85L27.2 25.15A1.65 1.65 0 0 0 28.85 26.8C29.95 26.8 32.15 25.15 32.15 23.5Z" class="antz-p-move_animal-f-ink" fill="#00451F"/>
    <circle cx="33.25" cy="19.65" r="1.45" class="antz-p-move_animal-f-ink" fill="#00451F"/>
    <circle cx="36" cy="21.85" r="1.6" class="antz-p-move_animal-f-ink" fill="#00451F"/>
    <circle cx="36" cy="25.15" r="1.6" class="antz-p-move_animal-f-ink" fill="#00451F"/>
    <circle cx="33.25" cy="27.35" r="1.45" class="antz-p-move_animal-f-ink" fill="#00451F"/>
  </g>
  <path d="M22 10.5H37A3 3 0 0 1 40 13.5V34.5A3 3 0 0 1 37 37.5H22" class="antz-p-move_animal-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-move_animal-arrow">
    <path d="M5 24H23M17 18L23 24 17 30" class="antz-p-move_animal-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
