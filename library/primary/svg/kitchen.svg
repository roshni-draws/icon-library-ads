<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-kitchen" role="img" aria-label="Kitchen">
<style>
.antz-p-kitchen-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-kitchen-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-kitchen-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-kitchen-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-kitchen-steam1{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}12%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}13%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}16%{transform:translate(0px,-0.5px) rotate(0deg) scale(1);opacity:1}28%{transform:translate(0px,-2.5px) rotate(0deg) scale(1);opacity:1}40%{transform:translate(0px,-5px) rotate(0deg) scale(1);opacity:0}41%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-kitchen-steam1{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-kitchen-steam1 3450ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-kitchen-steam1-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}12%{stroke-dasharray:1 2;stroke-dashoffset:0}13%{stroke-dasharray:0.05 2;stroke-dashoffset:0}16%{stroke-dasharray:0.25 2;stroke-dashoffset:0}28%{stroke-dasharray:1 2;stroke-dashoffset:0}40%{stroke-dasharray:1 2;stroke-dashoffset:0}41%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-kitchen-steam1-trim{animation:antz-p-kitchen-steam1-trim 3450ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-kitchen-steam2{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}18%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}19%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}22%{transform:translate(0px,-0.5px) rotate(0deg) scale(1);opacity:1}34%{transform:translate(0px,-2.5px) rotate(0deg) scale(1);opacity:1}46%{transform:translate(0px,-5px) rotate(0deg) scale(1);opacity:0}47%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-kitchen-steam2{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-kitchen-steam2 3450ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-kitchen-steam2-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}18%{stroke-dasharray:1 2;stroke-dashoffset:0}19%{stroke-dasharray:0.05 2;stroke-dashoffset:0}22%{stroke-dasharray:0.25 2;stroke-dashoffset:0}34%{stroke-dasharray:1 2;stroke-dashoffset:0}46%{stroke-dasharray:1 2;stroke-dashoffset:0}47%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-kitchen-steam2-trim{animation:antz-p-kitchen-steam2-trim 3450ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-kitchen-lid{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}6%{transform:translate(0px,0px) rotate(0deg) scale(1);}18%{transform:translate(0px,-3px) rotate(-8deg) scale(1);}32%{transform:translate(0px,-3px) rotate(-6deg) scale(1);}44%{transform:translate(0px,-3px) rotate(-8deg) scale(1);}54%{transform:translate(0px,0.4px) rotate(1deg) scale(1);}60%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-kitchen-lid{transform-box:view-box;transform-origin:24px 17px;animation:antz-p-kitchen-lid 3450ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-kitchen *{animation:none!important}}
</style>
