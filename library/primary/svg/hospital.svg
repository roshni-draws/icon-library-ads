  <path d="M39 13.5H39.2A1.3 1.3 0 0 1 40.5 14.8V38H39Z" class="antz-p-hospital-f-shade" fill="#00451F" fill-opacity="0.2"/>
  <path d="M34 39.5V34A1.5 1.5 0 0 1 35.5 32.5H37.5A1.5 1.5 0 0 1 39 34V39.5Z" class="antz-p-hospital-f-accent antz-p-hospital-s-ink" fill="#005226" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4.5 39.5H42" class="antz-p-hospital-s-ink" fill="none" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
