    <path d="M23.7 18.65C24.335 18.65 24.85 19.165 24.85 19.8C24.85 20.435 24.335 20.95 23.7 20.95C23.065 20.95 22.55 20.435 22.55 19.8C22.55 19.165 23.065 18.65 23.7 18.65Z" class="antz-p-hospital-f-ink" fill="#00451F"/>
