<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-hospital" role="img" aria-label="Hospital">
<style>
.antz-p-hospital-f-accent{fill:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-hospital-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-hospital-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-hospital-f-shade{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-hospital-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-hospital-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-hospital-elephant{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}10%{transform:translate(1px,-1px) rotate(0deg) scale(1);}16%{transform:translate(2px,0px) rotate(0deg) scale(1);}22%{transform:translate(3px,-1px) rotate(0deg) scale(1);}28%{transform:translate(4px,0px) rotate(0deg) scale(1);}50%{transform:translate(4px,0px) rotate(0deg) scale(1);}58%{transform:translate(2px,-1px) rotate(0deg) scale(1);}66%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-hospital-elephant{transform-box:view-box;transform-origin:15px 38px;animation:antz-p-hospital-elephant 3150ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-hospital-trunk{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}6%{transform:translate(0px,0px) rotate(0deg) scale(1);}20%{transform:translate(0px,0px) rotate(-8deg) scale(1);}50%{transform:translate(0px,0px) rotate(-8deg) scale(1);}62%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-hospital-trunk{transform-box:view-box;transform-origin:25.6px 23px;animation:antz-p-hospital-trunk 3150ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-hospital-cross{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}30%{transform:translate(0px,0px) rotate(0deg) scale(1);}36%{transform:translate(0px,0px) rotate(0deg) scale(1.1);}41%{transform:translate(0px,0px) rotate(0deg) scale(1);}46%{transform:translate(0px,0px) rotate(0deg) scale(1.06);}52%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-hospital-cross{transform-box:view-box;transform-origin:36.5px 19.5px;animation:antz-p-hospital-cross 3150ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-hospital *{animation:none!important}}
</style>
