<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-assessments" role="img" aria-label="Assessments">
<style>
.antz-p-assessments-f-fill{fill:var(--antz-tertiary-fixed,#CCE5FF)}
.antz-p-assessments-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-assessments-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-assessments-s-accent{stroke:var(--antz-on-primary-fixed-variant,#005226)}
.antz-p-assessments-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-assessments-clipboard{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}14%{transform:translate(0px,-2px) rotate(-4deg) scale(1);}26%{transform:translate(0px,0px) rotate(0deg) scale(1);}50%{transform:translate(0px,0px) rotate(0deg) scale(1);}56%{transform:translate(0px,0px) rotate(0deg) scale(1.04);}63%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-assessments-clipboard{transform-box:view-box;transform-origin:24px 37.5px;animation:antz-p-assessments-clipboard 3600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-assessments-check1{0%{opacity:1}4%{opacity:1}10%{opacity:0}11%{opacity:0}18%{opacity:0}19%{opacity:1}30%{opacity:1}100%{opacity:1}}
.antz-p-assessments-check1{animation:antz-p-assessments-check1 3600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-assessments-check1-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}10%{stroke-dasharray:1 2;stroke-dashoffset:0}11%{stroke-dasharray:0 2;stroke-dashoffset:0}18%{stroke-dasharray:0 2;stroke-dashoffset:0}19%{stroke-dasharray:0.05 2;stroke-dashoffset:0}30%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-assessments-check1-trim{animation:antz-p-assessments-check1-trim 3600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-assessments-check2{0%{opacity:1}4%{opacity:1}10%{opacity:0}11%{opacity:0}32%{opacity:0}33%{opacity:1}44%{opacity:1}100%{opacity:1}}
.antz-p-assessments-check2{animation:antz-p-assessments-check2 3600ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-assessments-check2-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}10%{stroke-dasharray:1 2;stroke-dashoffset:0}11%{stroke-dasharray:0 2;stroke-dashoffset:0}32%{stroke-dasharray:0 2;stroke-dashoffset:0}33%{stroke-dasharray:0.05 2;stroke-dashoffset:0}44%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-assessments-check2-trim{animation:antz-p-assessments-check2-trim 3600ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-assessments *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-assessments-f-tile" fill="#36BC69"/>
  <g class="antz-p-assessments-clipboard">
    <rect x="13.5" y="13.5" width="21" height="24" rx="3" class="antz-p-assessments-f-fill antz-p-assessments-s-ink" fill="#CCE5FF" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="19.5" y="10" width="9" height="6.5" rx="2.5" class="antz-p-assessments-f-ink" fill="#00451F"/>
    <path d="M27 22.5H30.5M27 30.5H30.5" class="antz-p-assessments-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="antz-p-assessments-check1">
      <path d="M17 22.5L19.5 25L23.5 20.5" class="antz-p-assessments-s-accent antz-p-assessments-check1-trim" fill="none" stroke="#005226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/>
    </g>
    <g class="antz-p-assessments-check2">
      <path d="M17 30.5L19.5 33L23.5 28.5" class="antz-p-assessments-s-accent antz-p-assessments-check2-trim" fill="none" stroke="#005226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/>
    </g>
  </g>
</svg>
