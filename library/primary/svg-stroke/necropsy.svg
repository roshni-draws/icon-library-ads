<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-necropsy-stroke" role="img" aria-label="Necropsy">
<style>
.antz-p-necropsy-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-necropsy-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-necropsy-stroke-mark{0%{opacity:1}4%{opacity:1}11%{opacity:0}12%{opacity:0}26%{opacity:0}27%{opacity:1}50%{opacity:1}100%{opacity:1}}
.antz-p-necropsy-stroke-mark{animation:antz-p-necropsy-stroke-mark 3550ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-necropsy-stroke-mark-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}11%{stroke-dasharray:1 2;stroke-dashoffset:0}12%{stroke-dasharray:0 2;stroke-dashoffset:0}26%{stroke-dasharray:0 2;stroke-dashoffset:0}27%{stroke-dasharray:0.03 2;stroke-dashoffset:0}50%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-necropsy-stroke-mark-trim{animation:antz-p-necropsy-stroke-mark-trim 3550ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-necropsy-stroke-scalpel{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}6%{transform:translate(0px,0px) rotate(0deg) scale(1);}18%{transform:translate(-2.5px,-3px) rotate(-6deg) scale(1);}27%{transform:translate(-3px,0px) rotate(0deg) scale(1);}50%{transform:translate(3.5px,0px) rotate(0deg) scale(1);}62%{transform:translate(0px,-1px) rotate(0deg) scale(1);}70%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-necropsy-stroke-scalpel{transform-box:view-box;transform-origin:13.5px 32px;animation:antz-p-necropsy-stroke-scalpel 3550ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-necropsy-stroke *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-necropsy-stroke-f-tile" fill="#36BC69"/>
  <rect x="9" y="34" width="30" height="7.5" rx="3" class="antz-p-necropsy-stroke-f-tile antz-p-necropsy-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-necropsy-stroke-mark">
    <path d="M14.5 37.75H33.5" class="antz-p-necropsy-stroke-s-ink antz-p-necropsy-stroke-mark-trim" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/>
  </g>
  <g class="antz-p-necropsy-stroke-scalpel">
    <path d="M30.606 19.325L37.552 12.132" class="antz-p-necropsy-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.5 32L24.615 20.491 29.65 25.353C27.64 31.753 20.979 35.052 13.5 32Z" class="antz-p-necropsy-stroke-f-tile antz-p-necropsy-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
