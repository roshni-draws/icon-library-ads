<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-department-stroke" role="img" aria-label="Department">
<style>
.antz-p-department-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-department-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-department-stroke-top{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}13%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}22%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}31%{transform:translate(1px,0px) rotate(0deg) scale(1);opacity:1}37%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-department-stroke-top{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-department-stroke-top 4250ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-department-stroke-bottom{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}4%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}13%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}30%{transform:translate(-4px,0px) rotate(0deg) scale(1);opacity:0}39%{transform:translate(1px,0px) rotate(0deg) scale(1);opacity:1}45%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:1}}
.antz-p-department-stroke-bottom{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-department-stroke-bottom 4250ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-department-stroke-head{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}12%{transform:translate(0px,0px) rotate(0deg) scale(1);}18%{transform:translate(0px,0px) rotate(0deg) scale(1.1);}24%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-department-stroke-head{transform-box:view-box;transform-origin:13.5px 24px;animation:antz-p-department-stroke-head 4250ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-department-stroke *{animation:none!important}}
</style>
