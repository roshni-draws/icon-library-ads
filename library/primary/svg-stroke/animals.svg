@keyframes antz-p-animals-stroke-dust2{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}40%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}45%{transform:translate(1.4px,0.75px) rotate(0deg) scale(1);opacity:1}54%{transform:translate(2.8px,1.875px) rotate(0deg) scale(1);opacity:1}62%{transform:translate(3.5px,2.5px) rotate(0deg) scale(1);opacity:0}63%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
