<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-diet-stroke" role="img" aria-label="Diet">
<style>
.antz-p-diet-stroke-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-diet-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-diet-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-diet-stroke-food{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}28%{transform:translate(0px,0px) rotate(0deg) scale(1);}33%{transform:translate(0px,-0.8px) rotate(0deg) scale(1.06);}40%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-diet-stroke-food{transform-box:view-box;transform-origin:24px 30px;animation:antz-p-diet-stroke-food 3350ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-diet-stroke-apple{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}10%{transform:translate(0px,0.6px) rotate(0deg) scale(0.97);}20%{transform:translate(0px,-4px) rotate(0deg) scale(1.02);}30%{transform:translate(0px,0.6px) rotate(0deg) scale(0.95);}38%{transform:translate(0px,-0.6px) rotate(0deg) scale(1.02);}46%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-diet-stroke-apple{transform-box:view-box;transform-origin:24px 32px;animation:antz-p-diet-stroke-apple 3350ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-diet-stroke *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-diet-stroke-f-tile" fill="#36BC69"/>
  <ellipse cx="24" cy="28" rx="15" ry="4.5" class="antz-p-diet-stroke-f-tile antz-p-diet-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-diet-stroke-food">
    <path d="M15 28.6C19 26.4 29 26.4 33 28.6" class="antz-p-diet-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="antz-p-diet-stroke-apple">
    <path d="M24 20.5V14.75" class="antz-p-diet-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 14.75Q24 11.3 27.45 11.3 27.45 14.75 24 14.75Z" class="antz-p-diet-stroke-f-ink antz-p-diet-stroke-s-ink" fill="#00451F" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 20.5C21.7 18.2 15.95 18.2 15.95 25.1 15.95 29.7 19.4 32 24 32 28.6 32 32.05 29.7 32.05 25.1 32.05 18.2 26.3 18.2 24 20.5Z" class="antz-p-diet-stroke-f-tile antz-p-diet-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M9 28A15 4.5 0 0 0 39 28C39 35.5 32.5 40.5 24 40.5C15.5 40.5 9 35.5 9 28Z" class="antz-p-diet-stroke-f-tile antz-p-diet-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
