<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-settings-stroke" role="img" aria-label="Settings">
<style>
.antz-p-settings-stroke-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-settings-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-settings-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-settings-stroke-small{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}12%{transform:translate(0px,0px) rotate(6deg) scale(1);}34%{transform:translate(0px,0px) rotate(-12deg) scale(1);}42%{transform:translate(0px,0px) rotate(-9deg) scale(1);}62%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-settings-stroke-small{transform-box:view-box;transform-origin:36px 12px;animation:antz-p-settings-stroke-small 4450ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-settings-stroke-big{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}12%{transform:translate(0px,0px) rotate(-5deg) scale(1);}34%{transform:translate(0px,0px) rotate(12deg) scale(1);}42%{transform:translate(0px,0px) rotate(9deg) scale(1);}62%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-settings-stroke-big{transform-box:view-box;transform-origin:21px 27.5px;animation:antz-p-settings-stroke-big 4450ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-settings-stroke *{animation:none!important}}
</style>
