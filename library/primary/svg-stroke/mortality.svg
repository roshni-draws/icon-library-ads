<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-mortality-stroke" role="img" aria-label="Mortality">
<style>
.antz-p-mortality-stroke-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-mortality-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-mortality-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-mortality-stroke-fallingLeaf{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}6%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}16%{transform:translate(-1.2px,1.6px) rotate(-10deg) scale(1);opacity:1}32%{transform:translate(1px,4px) rotate(10deg) scale(1);opacity:1}48%{transform:translate(-0.8px,6.2px) rotate(-8deg) scale(1);opacity:1}64%{transform:translate(0.8px,7.8px) rotate(4deg) scale(1);opacity:0}65%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-mortality-stroke-fallingLeaf{transform-box:view-box;transform-origin:37.5px 11px;animation:antz-p-mortality-stroke-fallingLeaf 3500ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-mortality-stroke *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-mortality-stroke-f-tile" fill="#36BC69"/>
  <path d="M9 22.5A12 12 0 0 1 33 22.5V27A3 3 0 0 1 30 30V34.5A3 3 0 0 1 27 37.5H15A3 3 0 0 1 12 34.5V30A3 3 0 0 1 9 27Z" class="antz-p-mortality-stroke-f-tile antz-p-mortality-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16.5 21.4C17.936 21.4 19.1 22.564 19.1 24C19.1 25.436 17.936 26.6 16.5 26.6C15.064 26.6 13.9 25.436 13.9 24C13.9 22.564 15.064 21.4 16.5 21.4Z" class="antz-p-mortality-stroke-f-ink" fill="#00451F"/>
  <path d="M25.5 21.4C26.936 21.4 28.1 22.564 28.1 24C28.1 25.436 26.936 26.6 25.5 26.6C24.064 26.6 22.9 25.436 22.9 24C22.9 22.564 24.064 21.4 25.5 21.4Z" class="antz-p-mortality-stroke-f-ink" fill="#00451F"/>
  <path d="M21 31.5V37.5" class="antz-p-mortality-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-mortality-stroke-fallingLeaf" opacity="0">
    <path d="M32.304 14Q34.5 5.804 42.696 8 40.5 16.196 32.304 14Z" class="antz-p-mortality-stroke-f-tile antz-p-mortality-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35.075 12.4L39.925 9.6" class="antz-p-mortality-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
