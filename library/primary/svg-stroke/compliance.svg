<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-compliance-stroke" role="img" aria-label="Compliance">
<style>
.antz-p-compliance-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-compliance-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-compliance-stroke-seal{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}8%{transform:translate(0px,0px) rotate(0deg) scale(1);}18%{transform:translate(0px,-3px) rotate(0deg) scale(0.9);}24%{transform:translate(0px,-3px) rotate(0deg) scale(0.9);}30%{transform:translate(0px,0px) rotate(0deg) scale(1.08);}38%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-compliance-stroke-seal{transform-box:view-box;transform-origin:32px 32px;animation:antz-p-compliance-stroke-seal 4350ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-compliance-stroke-check{0%{opacity:1}4%{opacity:1}10%{opacity:0}11%{opacity:0}34%{opacity:0}35%{opacity:1}48%{opacity:1}100%{opacity:1}}
.antz-p-compliance-stroke-check{animation:antz-p-compliance-stroke-check 4350ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-compliance-stroke-check-trim{0%{stroke-dasharray:1 2;stroke-dashoffset:0}4%{stroke-dasharray:1 2;stroke-dashoffset:0}10%{stroke-dasharray:1 2;stroke-dashoffset:0}11%{stroke-dasharray:0 2;stroke-dashoffset:0}34%{stroke-dasharray:0 2;stroke-dashoffset:0}35%{stroke-dasharray:0.05 2;stroke-dashoffset:0}48%{stroke-dasharray:1 2;stroke-dashoffset:0}100%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.antz-p-compliance-stroke-check-trim{animation:antz-p-compliance-stroke-check-trim 4350ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-compliance-stroke *{animation:none!important}}
</style>
  <rect x="0" y="0" width="48" height="48" rx="14" class="antz-p-compliance-stroke-f-tile" fill="#36BC69"/>
