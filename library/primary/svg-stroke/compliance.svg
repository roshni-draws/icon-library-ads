  <path d="M14 14H25M14 20.5H21" class="antz-p-compliance-stroke-s-ink" fill="none" stroke="#00451F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="antz-p-compliance-stroke-seal">
    <path d="M32 23L34 25H39V30L41 32 39 34V39H34L32 41 30 39H25V34L23 32 25 30V25H30Z" class="antz-p-compliance-stroke-f-tile antz-p-compliance-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 27.6C34.43 27.6 36.4 29.57 36.4 32C36.4 34.43 34.43 36.4 32 36.4C29.57 36.4 27.6 34.43 27.6 32C27.6 29.57 29.57 27.6 32 27.6Z" class="antz-p-compliance-stroke-f-tile antz-p-compliance-stroke-s-ink" fill="#36BC69" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="antz-p-compliance-stroke-check">
      <path d="M29.8 32.1L31.4 33.7L34.3 30.6" class="antz-p-compliance-stroke-s-ink antz-p-compliance-stroke-check-trim" fill="none" stroke="#00451F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="0"/>
    </g>
  </g>
</svg>
