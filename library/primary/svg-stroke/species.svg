<style>
.antz-p-species-stroke-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-species-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-species-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-species-stroke-back{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}10%{transform:translate(0px,0px) rotate(0deg) scale(1);}20%{transform:translate(-2.8px,-2.8px) rotate(0deg) scale(1);}46%{transform:translate(-2.8px,-2.8px) rotate(0deg) scale(1);}58%{transform:translate(0.3px,0.3px) rotate(0deg) scale(1);}64%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-species-stroke-back{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-species-stroke-back 3050ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-species-stroke-middle{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}4%{transform:translate(0px,0px) rotate(0deg) scale(1);}14%{transform:translate(-2px,-2px) rotate(0deg) scale(1);}46%{transform:translate(-2px,-2px) rotate(0deg) scale(1);}58%{transform:translate(0.3px,0.3px) rotate(0deg) scale(1);}64%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-species-stroke-middle{transform-box:view-box;transform-origin:24px 24px;animation:antz-p-species-stroke-middle 3050ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-species-stroke-paw{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}24%{transform:translate(0px,0px) rotate(0deg) scale(1);}30%{transform:translate(0px,0px) rotate(0deg) scale(0.9);}36%{transform:translate(0px,0px) rotate(0deg) scale(1.1);}44%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-species-stroke-paw{transform-box:view-box;transform-origin:28.5px 32px;animation:antz-p-species-stroke-paw 3050ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-species-stroke *{animation:none!important}}
</style>
