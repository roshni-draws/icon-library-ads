<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-p-pharmacy-stroke" role="img" aria-label="Pharmacy">
<style>
.antz-p-pharmacy-stroke-f-ink{fill:var(--antz-on-primary-container,#00451F)}
.antz-p-pharmacy-stroke-f-tile{fill:var(--antz-primary-container,#36BC69)}
.antz-p-pharmacy-stroke-s-ink{stroke:var(--antz-on-primary-container,#00451F)}
@keyframes antz-p-pharmacy-stroke-capsule{0%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}12%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}18%{transform:translate(1px,-3px) rotate(-6deg) scale(1);opacity:1}30%{transform:translate(5px,-5.5px) rotate(10deg) scale(1);opacity:1}40%{transform:translate(7px,-3.5px) rotate(12deg) scale(1);opacity:0}41%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(1);opacity:0}}
.antz-p-pharmacy-stroke-capsule{transform-box:view-box;transform-origin:24.2px 13px;animation:antz-p-pharmacy-stroke-capsule 3200ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes antz-p-pharmacy-stroke-cap{0%{transform:translate(0px,0px) rotate(0deg) scale(1);}6%{transform:translate(0px,0px) rotate(0deg) scale(1);}16%{transform:translate(0px,-3px) rotate(-12deg) scale(1);}28%{transform:translate(0px,-3px) rotate(-12deg) scale(1);}36%{transform:translate(0px,0.4px) rotate(1deg) scale(1);}42%{transform:translate(0px,0px) rotate(0deg) scale(1);}100%{transform:translate(0px,0px) rotate(0deg) scale(1);}}
.antz-p-pharmacy-stroke-cap{transform-box:view-box;transform-origin:18px 16px;animation:antz-p-pharmacy-stroke-cap 3200ms cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.antz-p-pharmacy-stroke *{animation:none!important}}
</style>
